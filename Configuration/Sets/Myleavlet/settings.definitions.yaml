categories:
  Myleavlet:
    label: 'Myleaflet'
  Myleavlet.templates:
    label: 'Templates'
    parent: Myleavlet
  Myleavlet.layout:
    label: 'Layout'
    parent: Myleavlet
  Myleavlet.pages:
    label: 'Pages'
    parent: Myleavlet
  Myleavlet.options:
    label: 'Options'
    parent: Myleavlet

settings:
#  plugin.tx_myleaflet.view.templateRootPath:
#  Myleavlet.templateRootPath:
  plugin.tx_myleaflet.view.templateRootPath:
    label: 'Page template path'
    category: Myleavlet.templates
    description: 'Path to templates root'
    type: string
    default: 'EXT:myleaflet/Resources/Private/Templates/'

#  Myleavlet.partialRootPath:
  plugin.tx_myleaflet.view.partialRootPath:
    label: 'Partials'
    category: Myleavlet.templates
    description: 'Path to partial root'
    type: string
    default: 'EXT:myleaflet/Resources/Private/Partials/'
#  Myleavlet.layoutRootPath:
  plugin.tx_myleaflet.view.layoutRootPath:
    label: 'Layouts'
    category: Myleavlet.templates
    description: 'Path to layout root'
    type: string
    default: 'EXT:myleaflet/Resources/Private/Layouts/'

  plugin.tx_myleaflet.view.includejQueryCore:
    label: 'IncludejQueryCore'
    category: Myleavlet.templates
    description: 'IncludejQueryCore [0|1]'
    type: bool
    default: 0
  plugin.tx_myleaflet.view.jQueryFile:
    label: 'jQueryFile'
    category: Myleavlet.templates
    description: 'jQuery file'
    type: string
    default: 'EXT:myleaflet/Resources/Public/JavaScript/jquery-3.5.1.min.js'
  plugin.tx_myleaflet.view.cssFile:
    label: 'cssFile'
    category: Myleavlet.templates
    description: 'cssFile'
    type: string
    default: 'EXT:myleaflet/Resources/Public/CSS/myleaflet.css'



#  Myleavlet.storagePid:
  plugin.tx_myleaflet.persistence.storagePid:
    label: 'Default storage PID'
    category: Myleavlet.pages
    description: 'Folder that stores all data'
    type: page
    default: 0
  plugin.tx_myleaflet.settings.detailsPageId:
    label: 'details pageId'
    category: Myleavlet.options
    description: 'The page uid of the details view'
    type: int
    default: 0
  plugin.tx_myleaflet.settings.resultLimit:
    label: 'result limit'
    category: Myleavlet.options
    description: 'The limit of results'
    type: int
    default: 300
  plugin.tx_myleaflet.settings.initialMapCoordinates:
    label: 'initial map coordinates'
    category: Myleavlet.options
    description: 'The initial coordinates of the map'
    type: string
    default: 48,8
  plugin.tx_myleaflet.settings.categorySelectMode:
    label: 'Category select mode: [AND|OR] Default OR'
    category: Myleavlet.options
    description: 'Category select mode: [AND|OR] Default OR'
    type: string
    default: OR
  plugin.tx_myleaflet.settings.enableMarkerClusterer:
    label: 'enable marker clusterer'
    category: Myleavlet.options
    description: 'Enable the marker clusterer'
    type: bool
    default: 0
  plugin.tx_myleaflet.settings.defaultIcon:
    label: 'default icon'
    category: Myleavlet.options
    description: 'default marker icon'
    type: string
    default: 'pointerRed.png'
  plugin.tx_myleaflet.settings.defaultLanguageUid:
    label: 'default language uid'
    category: Myleavlet.options
    description: 'Default language Uid'
    type: string
    default: '0'

